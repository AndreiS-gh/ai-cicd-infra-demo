name: GPT Review of Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gpt-review:
    name: Review PR with GPT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensure we can diff against main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd automation/js
          npm install

      - name: Generate filtered diff
        run: |
          git fetch origin main:refs/remotes/origin/main

          echo "🔍 Changed files:"
          git diff origin/main...HEAD --name-only | tee changed_files.txt

          echo "📄 Filtered files:"
          grep -E '\.(js|cjs|yml|yaml|tf|tfvars\.json)$' changed_files.txt | tee filtered_files.txt

          if [ ! -s filtered_files.txt ]; then
            echo "🟢 No relevant file changes to review." > automation/js/diff.patch
          else
            # Safely build filtered diff
            while IFS= read -r file; do
              git diff origin/main...HEAD -- "$file"
            done < filtered_files.txt > automation/js/diff.patch
          fi

      - name: Run GPT Code Reviewer
        run: |
          cd automation/js
          node pr_review.cjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
