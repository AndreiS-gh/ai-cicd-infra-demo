name: GCP Terraform Deployment

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Deploy GCP Infra
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-jammy

    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            jq \
            curl \
            unzip \
            gnupg \
            lsb-release \
            software-properties-common   

      - name: Checkout repository
        uses: actions/checkout@v3

      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'    

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Read Terraform Action
        id: tf_action
        run: |
          ACTION=$(jq -r '.tf_action' gcp/infra/terraform.tfvars.json)
          echo "Terraform action is: $ACTION"
          echo "action=$ACTION" >> $GITHUB_OUTPUT

      - name: Terraform Init
        if: steps.tf_action.outputs.action == 'apply' || steps.tf_action.outputs.action == 'destroy'
        run: |
          cd gcp/infra
          terraform init

      - name: Terraform Destroy
        if: steps.tf_action.outputs.action == 'destroy'
        run: |
          cd gcp/infra
          terraform destroy -var-file=terraform.tfvars.json -auto-approve

      - name: Terraform Plan
        if: steps.tf_action.outputs.action == 'apply'
        run: |
          cd gcp/infra
          terraform plan -var-file=terraform.tfvars.json 2>&1 | tee terraform_plan.log

      - name: Terraform Apply
        if: steps.tf_action.outputs.action == 'apply'
        run: |
          cd gcp/infra
          terraform apply -var-file=terraform.tfvars.json -auto-approve 2>&1 | tee terraform_apply.log

      - name: Install JS dependencies for automation
        run: |
          cd automation/js
          echo "Installing Node.js and dependencies"
          npm install
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Generate All AI-Powered Docs
        run: |
          cd automation/js
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" node generate_docs.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit Generated Docs
        run: |
          git config --global user.name "ci-bot-ai"
          git config --global user.email "ci-bot-ai@demo-ai.com"
          git config --global --add safe.directory $GITHUB_WORKSPACE
          # Stage docs in gcp/infra and README in root
          git add gcp/infra/*.md README.md
          # Check if anything changed
          if git diff --cached --quiet; then
            echo "🟢 No doc changes to commit."
          else
            git commit -m "📝 Auto-generated Terraform docs & project README [skip ci]"
            git pull --rebase origin ${GITHUB_REF#refs/heads/} || true
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Logs
        if: steps.tf_action.outputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-logs
          path: |
            gcp/infra/terraform_plan.log
            gcp/infra/terraform_apply.log

      - name: Get Outputs
        if: steps.tf_action.outputs.action == 'apply'
        id: get_outputs
        run: |
          cd gcp/infra
          echo "APP_URL=$(terraform output -raw app_url)" >> $GITHUB_ENV
          echo "TEXT_TO_TEST=$(terraform output -raw text_to_test)" >> $GITHUB_ENV
          echo "S3_BUCKET=$(terraform output -raw gcs_bucket_name)" >> $GITHUB_ENV

      - name: Run AI-Powered Web Test
        if: steps.tf_action.outputs.action == 'apply'
        run: |
          cd automation/js

          echo "Generating Playwright test with OpenAI"
          TEST_URL="$APP_URL" OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" node generate_test.js
          
          echo "Running generated Playwright test"
          TEST_URL="$APP_URL" TEXT_TO_TEST="$TEXT_TO_TEST" npx playwright test ai_generated_test.spec.js | tee test-output.log
          
          RESULT=$(grep -o 'TEST_RESULT=.*' test-output.log | cut -d '=' -f2)
          echo "TEST_STATUS=${RESULT:-failed}" >> $GITHUB_ENV
        env:
          APP_URL: ${{ env.APP_URL }}
          TEXT_TO_TEST: ${{ env.TEXT_TO_TEST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload AI-Generated Test Script to GCS
        if: steps.tf_action.outputs.action == 'apply'
        id: upload_test_script
        run: |
          cd automation/js
          TEST_SCRIPT_GCS_URL=$(node upload_test_script.js | grep TEST_SCRIPT_GCS_URL | cut -d '=' -f2-)
          echo "TEST_SCRIPT_GCS_URL=$TEST_SCRIPT_GCS_URL" >> $GITHUB_ENV
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCS_BUCKET_NAME: ${{ env.S3_BUCKET }}

      - name: Upload Screenshot to GCS
        if: steps.tf_action.outputs.action == 'apply'
        run: |
          cd automation/js
          GCS_BUCKET_NAME="${{ env.S3_BUCKET }}" node upload_screenshot.js
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCS_BUCKET_NAME: ${{ env.S3_BUCKET }}

      - name: Send Email with Screenshot and Link
        if: steps.tf_action.outputs.action == 'apply'
        run: |
          cd automation/js
          node send_email.js
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TEST_STATUS: ${{ env.TEST_STATUS }}
          TEST_SCRIPT_GCS_URL: ${{ env.TEST_SCRIPT_GCS_URL }}
          APP_URL: ${{ env.APP_URL }}
